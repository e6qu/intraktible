# SPDX-License-Identifier: AGPL-3.0-or-later
# Every pinned image is a Docker Hub copy on public.ecr.aws or mirror.gcr.io.
# cmd/imagepins compares each pin with what Docker Hub serves for it, so a
# stale pin shows up on pull requests and, through the daily run, on main.
name: image-pins
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-pins:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Test the image pin policy
        run: go test ./cmd/imagepins/
      - name: Compare image pins with Docker Hub
        run: make image-pins
